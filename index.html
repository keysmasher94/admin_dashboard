<!doctype html>
<html lang="en-au">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Admin Dashboard</title>
  </head>
  <body>
    <div class="grid-container">
      <header>
        <div class="left-header">
          <button type="submit" form="search" id="search">
            <img
              id="search-icon"
              src="./assets/images/search.svg"
              alt="search icon"
            />
          </button>
          <form action="https://example.com" method="get" id="search">
            <input type="text" />
          </form>
        </div>
        <div class="right-header">
          <button type="submit">
            <img
              id="notification-icon"
              src="./assets/images/notifications.svg"
              alt="notifications icon"
            />
          </button>
          <img
            id="user-image-header"
            src="./assets/images/face.svg"
            alt="a placeholder user icon"
          />
          <p id="user-name-header">Morgan Oakley</p>
        </div>
      </header>
      <nav>
        <div class="nav-left">
          <img src="./assets/images/face.svg" alt="face icon" />
          <div class="welcome-message">
            <p>Hi there,</p>
            <h1>Morgan Oakley (@morgan)</h1>
          </div>
        </div>
        <div class="nav-right">
          <ul>
            <li>New</li>
            <li>Upload</li>
            <li>Share</li>
          </ul>
        </div>
      </nav>
      <div class="sidebar">
        <p>Sidebar</p>
      </div>
      <main>
        <p>Main</p>
      </main>
    </div>
  </body>
</html>
